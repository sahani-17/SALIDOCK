version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - CLOUD_ONLY_MODE=true
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-docking-results}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAX_DOCKING_WORKERS=${MAX_DOCKING_WORKERS:-4}
      - PORT=8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    restart: always

volumes:
  caddy_data:
  caddy_config:
