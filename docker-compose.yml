version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    env_file:
      - ./backend/.env          # loads all docking tuning vars (GNINA_BIN, QUICKVINA_BIN, etc.)
    environment:
      # These override anything in .env for production correctness
      - ENVIRONMENT=production
      - CLOUD_ONLY_MODE=true
      - PORT=8000
      # Docking binary paths (set explicitly so they are always correct in-container)
      - GNINA_BIN=/usr/local/bin/gnina
      - QUICKVINA_BIN=/usr/local/bin/qvina-w
      # CPU caps for the 2-vCPU Azure VM
      - GNINA_CPU=1
      - GNINA_EXHAUSTIVENESS=8
      - GNINA_NUM_MODES=5
      - QUICKVINA_EXHAUSTIVENESS=8
      - QUICKVINA_TIMEOUT_SEC=600
      # Clear the dev-machine LD_LIBRARY_PATH so it doesn't leak into the container
      - LD_LIBRARY_PATH=
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Named volume keeps session files alive across container restarts / redeployments
      - salidock_sessions:/tmp/SALIDOCK_Database

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    restart: always

volumes:
  caddy_data:
  caddy_config:
  # Persists session files across backend container restarts / redeployments
  salidock_sessions:
